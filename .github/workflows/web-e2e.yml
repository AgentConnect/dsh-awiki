name: Web E2E

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  smoke-linux:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    steps:
      - uses: actions/checkout@v4
        with:
          path: dsh-awiki
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
          cache-dependency-path: dsh-awiki/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: dsh-awiki
      - run: pnpm run e2e:smoke
        working-directory: dsh-awiki
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-awiki-web-smoke-linux
          path: dsh-awiki/.artifacts/e2e/runs
          if-no-files-found: error

  smoke-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            artifact: macos-intel
          - runner: macos-15
            artifact: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: dsh-awiki
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
          cache-dependency-path: dsh-awiki/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: dsh-awiki
      - run: pnpm exec playwright install chromium
        working-directory: dsh-awiki
      - run: pnpm run e2e:smoke
        working-directory: dsh-awiki
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dsh-awiki-web-smoke-${{ matrix.artifact }}
          path: dsh-awiki/.artifacts/e2e/runs
          if-no-files-found: error
