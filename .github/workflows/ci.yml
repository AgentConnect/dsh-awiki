name: CI

on:
  workflow_dispatch:
    inputs:
      test_packages:
        type: boolean
        default: false
        description: Build the frozen Singapore plugin tarballs only

permissions:
  contents: read

jobs:
  dependency-mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: detect
        shell: bash
        run: |
          if [[ -f dependencies.source.json ]]; then
            echo "mode=source" >> "$GITHUB_OUTPUT"
          else
            echo "mode=registry" >> "$GITHUB_OUTPUT"
          fi

  registry-check:
    needs: dependency-mode
    if: needs.dependency-mode.outputs.mode == 'registry' && !inputs.test_packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: python3 -m unittest discover -s scripts/dependencies -p 'test_*.py' -v
      - run: python3 scripts/dependencies/run.py --command verify:workspace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: registry-dependency-evidence
          path: .artifacts/dependencies/registry
          if-no-files-found: ignore

  source-integration-check:
    needs: dependency-mode
    if: needs.dependency-mode.outputs.mode == 'source' && !inputs.test_packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify exact source dependencies without publishing credentials
        run: python3 scripts/dependencies/run.py --deps source --source-manifest dependencies.source.json --command verify:workspace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-dependency-evidence
          path: .artifacts/dependencies/source
          if-no-files-found: ignore

  packages:
    if: inputs.test_packages && github.ref == 'refs/heads/test/singapore-release-20261012'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
      - run: python3 scripts/dependencies/run.py --deps source --source-manifest dependencies.source.json --command package-test
      - uses: actions/upload-artifact@v4
        with:
          name: singapore-test-plugins
          path: .artifacts/dependencies/source
          if-no-files-found: error
          retention-days: 30
