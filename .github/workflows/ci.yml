name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: dsh-awiki
      - uses: actions/checkout@v4
        with:
          repository: agent-network-protocol/anp
          ref: 45031b698e86e094dfef1f6d05fe9839a600854b
          path: anp/anp
      - uses: actions/checkout@v4
        with:
          repository: agent-network-protocol/anp-identity
          ref: 8dc65ccc388af0f0622263811776a6aadcd11d18
          path: anp/anp-identity
      - uses: actions/checkout@v4
        with:
          repository: AgentConnect/awiki-cli-rs2
          ref: c1f0b9761d599eae4d8e168803fb57cb650e2e47
          path: awiki-cli-rs2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: dsh-awiki/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: dsh-awiki
      - name: Build pinned AWiki IM Core Node wrapper
        working-directory: dsh-awiki
        run: pnpm --filter @awiki/im-core-node run build:typescript
      - name: Build pinned ANP Identity Node binding
        working-directory: anp/anp-identity
        run: |
          npm --prefix bindings/node ci
          npm --prefix bindings/node run build
      - run: pnpm --filter @agent-network-protocol/dsh-anp-identity run build
        working-directory: dsh-awiki
      - run: pnpm run verify:workspace
        working-directory: dsh-awiki
