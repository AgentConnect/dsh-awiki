name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: dsh-awiki
      - uses: actions/checkout@v4
        with:
          repository: agent-network-protocol/anp
          ref: 246d69e2c5b5cefb0cf13f2e9f0f6e497915f084
          path: anp/anp
      - uses: actions/checkout@v4
        with:
          repository: agent-network-protocol/anp-identity
          ref: a0af4e1590ef9b1911a40c9f25a83cbbccd0bd4b
          path: anp/anp-identity
      - uses: actions/checkout@v4
        with:
          repository: AgentConnect/awiki-cli-rs2
          ref: 11bcbb368f81158641a18b37d51e83b17c5d58ce
          path: awiki-cli-rs2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: dsh-awiki/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: dsh-awiki
      - name: Build pinned AWiki IM Core Node wrapper
        working-directory: dsh-awiki
        run: pnpm --filter @awiki/im-core-node run build:typescript
      - name: Build pinned ANP Identity Node binding
        working-directory: anp/anp-identity
        run: |
          npm --prefix bindings/node ci
          npm --prefix bindings/node run build
      - run: pnpm --filter @agent-network-protocol/dsh-anp-identity run build
        working-directory: dsh-awiki
      - run: pnpm run verify:workspace
        working-directory: dsh-awiki
      - name: Verify committed generated artifacts
        shell: bash
        working-directory: dsh-awiki
        run: |
          generated_changes="$(git status --porcelain --untracked-files=all -- lib packages/dsh-model-proxy/lib)"
          if [[ -n "$generated_changes" ]]; then
            printf '%s\n' "$generated_changes"
            echo "Generated artifacts differ from the committed tree. Run pnpm run verify:workspace and commit the result." >&2
            exit 1
          fi
