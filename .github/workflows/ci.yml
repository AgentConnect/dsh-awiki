name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: dsh-awiki
      - uses: actions/checkout@v4
        with:
          repository: agent-network-protocol/anp
          ref: e312a0fec6b5374262c7104d5e2c57a7e7e708e3
          path: anp
      - uses: actions/checkout@v4
        with:
          repository: agent-network-protocol/anp-identity
          ref: 9f75891cc74d52a166a2d23c884ac32101b0c739
          path: anp-identity
      - uses: actions/checkout@v4
        with:
          repository: AgentConnect/awiki-cli-rs2
          ref: 5fd332e27fa01ad6b61c0e85d42cef7afff1252f
          path: awiki-cli-rs2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: dsh-awiki/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: dsh-awiki
      - name: Build pinned ANP Identity Node binding
        working-directory: anp-identity
        run: |
          npm --prefix bindings/node ci
          npm --prefix bindings/node run build
      - run: pnpm --filter @agent-network-protocol/dsh-anp-identity run build
        working-directory: dsh-awiki
      - run: pnpm run verify:workspace
        working-directory: dsh-awiki
